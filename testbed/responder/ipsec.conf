# /etc/ipsec.conf — CipherLens Responder Node
config setup
    charondebug="ike 2, knl 2, cfg 2"

conn %default
    keyexchange=ikev2
    ike=aes256gcm128-prfsha384-modp2048!
    esp=aes256gcm128!
    dpdaction=restart
    dpddelay=30s

conn site-to-site
    left=192.168.100.20
    leftid=@responder.cipherlens.local
    leftauth=psk
    right=192.168.100.10
    rightid=@initiator.cipherlens.local
    rightauth=psk
    auto=add
